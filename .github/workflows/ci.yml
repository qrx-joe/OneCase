name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # SQLite 相对路径以 packages/db/prisma 为基准 (schema 所在目录)
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @onecase/db db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm -r test

      # 服务级业务不变量 (Confirm 完整性/兜底门禁/组织一致/analyze CAS):
      # 能构造 HTTP 与 Playwright 无法构造的状态,脚本自带 db:reset
      - name: Business invariant tests
        run: pnpm test:invariants

      - name: Build (all packages)
        run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm --filter @onecase/web exec playwright install --with-deps chromium

      - name: Prepare demo database
        run: pnpm --filter @onecase/db db:push

      - name: E2E (Playwright, webServer 自动拉起)
        run: pnpm --filter @onecase/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
