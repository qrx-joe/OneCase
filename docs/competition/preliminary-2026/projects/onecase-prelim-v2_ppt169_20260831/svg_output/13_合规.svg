<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">合规 · 红线对照</text>
    <text x="64" y="118" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">开源基础与本人贡献，分别说明</text>
    <line x1="64" y1="142" x2="1216" y2="142" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="license-table">
    <use data-icon="tabler-outline/scale" x="64" y="172" width="30" height="30" fill="#1E4D40" stroke-width="2"/>
    <text x="110" y="196" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#22302B">开源组件 License</text>
    <rect x="64" y="220" width="620" height="48" fill="#F0F2ED"/>
    <text x="88" y="250" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E4D40">组件</text>
    <text x="440" y="250" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E4D40">License</text>
    <text x="88" y="304" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">Next.js / React / Zod</text>
    <text x="440" y="304" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">MIT</text>
    <line x1="64" y1="320" x2="684" y2="320" stroke="#E4E8E1" stroke-width="1"/>
    <text x="88" y="368" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">Prisma</text>
    <text x="440" y="368" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">Apache-2.0</text>
    <line x1="64" y1="384" x2="684" y2="384" stroke="#E4E8E1" stroke-width="1"/>
    <text x="88" y="432" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">Lucide React</text>
    <text x="440" y="432" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#22302B">ISC</text>
    <line x1="64" y1="448" x2="684" y2="448" stroke="#1E4D40" stroke-width="2"/>
    <text x="64" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">2026-08-31 全量扫描仓库 27 个直接依赖（含开发工具），无 GPL 等传染性协议。</text>
  </g>

  <g id="contribution">
    <use data-icon="tabler-outline/shield-check" x="740" y="172" width="30" height="30" fill="#1E4D40" stroke-width="2"/>
    <text x="786" y="196" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#22302B">本人贡献</text>
    <text x="740" y="248" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">产品定义、业务规则设计、全部功能实现与测试</text>
    <text x="740" y="278" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">均由本人独立完成；项目未公开发表、未商业化。</text>
    <line x1="740" y1="330" x2="1216" y2="330" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="ai-note">
    <text x="740" y="380" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#22302B">AI 辅助使用说明</text>
    <text x="740" y="432" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">开发中使用 AI 编程工具辅助编码与测试；</text>
    <text x="740" y="462" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">产品判断、方案取舍与最终验收由本人负责。</text>
    <text x="740" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">框架、模型与第三方代码不表述为本人原创。</text>
  </g>

  <g id="statement">
    <line x1="64" y1="540" x2="1216" y2="540" stroke="#D8DED6" stroke-width="1"/>
    <text x="64" y="600" font-family="Georgia, SimSun, serif" font-size="28" fill="#1E4D40">原创边界清晰——参赛材料中的每一条声明，都可回溯到代码与测试。</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="694" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">13 / 14</text>
  </g>
</svg>
