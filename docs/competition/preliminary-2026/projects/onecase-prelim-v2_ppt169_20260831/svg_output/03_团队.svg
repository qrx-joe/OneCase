<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">团队 · 单人参赛</text>
    <text x="64" y="118" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">一个人，一个完整交付</text>
    <line x1="64" y1="142" x2="1216" y2="142" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="profile">
    <rect x="64" y="180" width="320" height="440" fill="#F0F2ED"/>
    <use data-icon="tabler-outline/user" x="96" y="216" width="44" height="44" fill="#1E4D40" stroke-width="2"/>
    <text x="96" y="316" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">乔瑞雪</text>
    <text x="96" y="356" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">不理不器 · 1 人团队</text>
    <line x1="96" y1="390" x2="352" y2="390" stroke="#D8DED6" stroke-width="1"/>
    <text x="96" y="428" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">AI+民生赛道 · 个人参赛</text>
    <text x="96" y="472" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">围绕社区事项整理这一个</text>
    <text x="96" y="500" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">完整场景，独立完成从产品</text>
    <text x="96" y="528" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">定义到测试的全流程。</text>
  </g>

  <g id="duty-1">
    <line x1="470" y1="200" x2="530" y2="200" stroke="#1E4D40" stroke-width="3"/>
    <text x="470" y="262" font-family="Georgia, SimSun, serif" font-size="32" font-weight="bold" fill="#D8DED6">01</text>
    <text x="470" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">产品定义</text>
    <text x="470" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">社区事项整理的流程设计</text>
    <text x="470" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">与业务规则：状态机、</text>
    <text x="470" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">确认门禁、查重策略。</text>
  </g>

  <g id="duty-2">
    <line x1="760" y1="200" x2="820" y2="200" stroke="#1E4D40" stroke-width="3"/>
    <text x="760" y="262" font-family="Georgia, SimSun, serif" font-size="32" font-weight="bold" fill="#D8DED6">02</text>
    <text x="760" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">全栈实现</text>
    <text x="760" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">Web 工作台、AI Provider</text>
    <text x="760" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">适配（Mock / Qwen / OpenAI）、</text>
    <text x="760" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">数据层与 API。</text>
  </g>

  <g id="duty-3">
    <line x1="1050" y1="200" x2="1110" y2="200" stroke="#1E4D40" stroke-width="3"/>
    <text x="1050" y="262" font-family="Georgia, SimSun, serif" font-size="32" font-weight="bold" fill="#D8DED6">03</text>
    <text x="1050" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">质量与文档</text>
    <text x="1050" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">单元测试、业务不变量</text>
    <text x="1050" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">测试、端到端流程测试</text>
    <text x="1050" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">与产品文档。</text>
  </g>

  <g id="duty-separators">
    <line x1="712" y1="180" x2="712" y2="440" stroke="#D8DED6" stroke-width="1"/>
    <line x1="1002" y1="180" x2="1002" y2="440" stroke="#D8DED6" stroke-width="1"/>
    <line x1="470" y1="470" x2="1216" y2="470" stroke="#E4E8E1" stroke-width="1"/>
    <text x="470" y="512" font-family="Georgia, SimSun, serif" font-size="28" fill="#1E4D40">把一个场景做完整，胜过把十个场景做一半。</text>
    <text x="470" y="556" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">暂缺的社区业务经验与交付资源，希望通过场景共建补齐——不把尚未建立的合作写成已有能力。</text>
  </g>

  <g id="footer">
    <text x="64" y="686" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="686" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">03 / 14</text>
  </g>
</svg>
