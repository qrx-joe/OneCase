<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowStep" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5E8C7B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">演示 · 现场环节</text>
    <text x="64" y="118" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">两分钟，一条反馈的两种去向</text>
    <line x1="64" y1="142" x2="1216" y2="142" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="chain-line">
    <line x1="330" y1="222" x2="360" y2="222" stroke="#5E8C7B" stroke-width="1.5" marker-end="url(#arrowStep)"/>
    <line x1="623" y1="222" x2="653" y2="222" stroke="#5E8C7B" stroke-width="1.5" marker-end="url(#arrowStep)"/>
    <line x1="916" y1="222" x2="946" y2="222" stroke="#5E8C7B" stroke-width="1.5" marker-end="url(#arrowStep)"/>
  </g>

  <g id="step-1">
    <text x="64" y="238" font-family="Georgia, SimSun, serif" font-size="48" font-weight="bold" fill="#5E8C7B">01</text>
    <line x1="64" y1="266" x2="124" y2="266" stroke="#1E4D40" stroke-width="3"/>
    <text x="64" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">粘贴一段反馈</text>
    <text x="64" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">同时包含照明与清运</text>
    <text x="64" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">两个问题的一段原文。</text>
  </g>

  <g id="step-2">
    <text x="357" y="238" font-family="Georgia, SimSun, serif" font-size="48" font-weight="bold" fill="#5E8C7B">02</text>
    <line x1="357" y1="266" x2="417" y2="266" stroke="#1E4D40" stroke-width="3"/>
    <text x="357" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">检查草稿与候选</text>
    <text x="357" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">两个草稿，各带相似</text>
    <text x="357" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">事项候选与依据。</text>
  </g>

  <g id="step-3">
    <text x="650" y="238" font-family="Georgia, SimSun, serif" font-size="48" font-weight="bold" fill="#D97B29">03</text>
    <line x1="650" y1="266" x2="710" y2="266" stroke="#D97B29" stroke-width="3"/>
    <text x="650" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">分别作出决策</text>
    <text x="650" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">照明关联已有事项；</text>
    <text x="650" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">清运问题新建事项。</text>
  </g>

  <g id="step-4">
    <text x="943" y="238" font-family="Georgia, SimSun, serif" font-size="48" font-weight="bold" fill="#5E8C7B">04</text>
    <line x1="943" y1="266" x2="1003" y2="266" stroke="#1E4D40" stroke-width="3"/>
    <text x="943" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">查看结果联动</text>
    <text x="943" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">来源、处理记录与</text>
    <text x="943" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">首页统计变化。</text>
  </g>

  <g id="demo-note">
    <rect x="64" y="470" width="1152" height="130" fill="#F0F2ED"/>
    <text x="100" y="524" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E4D40" letter-spacing="2">演示说明</text>
    <text x="100" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">演示数据为合成样例；现场标注实际运行的模型模式——真实 Provider，或用于流程验证的 Mock。</text>
  </g>

  <g id="footer">
    <text x="64" y="686" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="686" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">06 / 14</text>
  </g>
</svg>
