<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">容错 · 建议进入记录的保护</text>
    <text x="64" y="118" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">确认、修改、失败，都有路径</text>
    <line x1="64" y1="142" x2="1216" y2="142" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="quadrant-frame">
    <line x1="640" y1="180" x2="640" y2="620" stroke="#D8DED6" stroke-width="1"/>
    <line x1="64" y1="400" x2="1216" y2="400" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="quadrant-modify">
    <use data-icon="tabler-outline/pencil" x="64" y="188" width="32" height="32" fill="#1E4D40" stroke-width="2"/>
    <text x="112" y="214" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">草稿可修改</text>
    <text x="64" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">新建事项采用人工确认后的标题、地点、优先级，</text>
    <text x="64" y="296" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">并留下修改记录。</text>
    <text x="64" y="360" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#D8DED6">01</text>
  </g>

  <g id="quadrant-batch">
    <use data-icon="tabler-outline/checklist" x="704" y="188" width="32" height="32" fill="#1E4D40" stroke-width="2"/>
    <text x="752" y="214" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">批量确认</text>
    <text x="704" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">新建、关联与处理记录写入同一事务；</text>
    <text x="704" y="296" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">决策不完整则整体拒绝。</text>
    <text x="704" y="360" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#D8DED6">02</text>
  </g>

  <g id="quadrant-dedupe">
    <use data-icon="tabler-outline/circle-check" x="64" y="428" width="32" height="32" fill="#1E4D40" stroke-width="2"/>
    <text x="112" y="454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">防重复</text>
    <text x="64" y="506" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">已确认的反馈拒绝重复确认；</text>
    <text x="64" y="536" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">状态门禁拦住非法流转。</text>
    <text x="64" y="598" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#D8DED6">03</text>
  </g>

  <g id="quadrant-fallback">
    <use data-icon="tabler-outline/refresh" x="704" y="428" width="32" height="32" fill="#1E4D40" stroke-width="2"/>
    <text x="752" y="454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">失败兜底</text>
    <text x="704" y="506" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">AI 分析失败可重试；</text>
    <text x="704" y="536" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">符合条件的反馈可转人工手动创建。</text>
    <text x="704" y="598" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#D8DED6">04</text>
  </g>

  <g id="footer">
    <text x="64" y="686" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="686" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">07 / 14</text>
  </g>
</svg>
