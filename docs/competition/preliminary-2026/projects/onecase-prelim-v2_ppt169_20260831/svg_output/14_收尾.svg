<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#1E4D40"/>

  <g id="closing-hero">
    <text x="64" y="170" font-family="Georgia, SimSun, serif" font-size="40" font-weight="bold" fill="#FAFAF7">OneCase</text>
    <line x1="64" y1="204" x2="1216" y2="204" stroke="#5E8C7B" stroke-width="1"/>
    <text x="64" y="330" font-family="Georgia, SimSun, serif" font-size="56" font-weight="bold" fill="#FAFAF7">AI 整理建议，<tspan fill="#D97B29">人确认事实。</tspan></text>
    <text x="64" y="408" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#F0F2ED">让每条反馈有去向，每个事项可追踪。</text>
  </g>

  <g id="closing-invite">
    <text x="64" y="510" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F0F2ED" letter-spacing="3">期待共建</text>
    <text x="64" y="552" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" fill="#F0F2ED">真实场景 · 脱敏样本 · 流程评估</text>
    <text x="64" y="596" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#F0F2ED" fill-opacity="0.75">欢迎就业务价值、人工确认机制与落地边界提问</text>
  </g>

  <g id="footer">
    <line x1="64" y1="648" x2="1216" y2="648" stroke="#5E8C7B" stroke-width="1"/>
    <text x="64" y="686" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#F0F2ED">乔瑞雪 · 不理不器 · AI+民生</text>
    <text x="1216" y="686" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#F0F2ED" fill-opacity="0.75">Q &amp; A · 14 / 14</text>
  </g>
</svg>
