<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">原则 · 第一性设计</text>
  </g>

  <g id="statement">
    <text x="64" y="270" font-family="Georgia, SimSun, serif" font-size="68" font-weight="bold" fill="#1E4D40">AI 提出建议，</text>
    <text x="64" y="370" font-family="Georgia, SimSun, serif" font-size="68" font-weight="bold" fill="#D97B29">人决定事实。</text>
    <line x1="64" y1="420" x2="400" y2="420" stroke="#D8DED6" stroke-width="1"/>
    <text x="64" y="470" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#5C6B64">分析成功，不会自动生成正式事项——每一条正式记录，都经人确认。</text>
    <text x="64" y="510" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#8A968F">原始反馈、AI 草稿与正式事项分开保存；来源信息全程保留。</text>
  </g>

  <g id="chain">
    <text x="64" y="592" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5C6B64" letter-spacing="3" font-weight="bold">处理流程</text>
    <line x1="64" y1="610" x2="1216" y2="610" stroke="#D8DED6" stroke-width="1"/>
    <text x="64" y="652" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">居民文字反馈</text>
    <line x1="210" y1="646" x2="250" y2="646" stroke="#5E8C7B" stroke-width="1.5"/>
    <text x="264" y="652" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">AI 事项草稿</text>
    <line x1="410" y1="646" x2="450" y2="646" stroke="#5E8C7B" stroke-width="1.5"/>
    <text x="464" y="652" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E4D40">人工检查</text>
    <line x1="590" y1="646" x2="630" y2="646" stroke="#5E8C7B" stroke-width="1.5"/>
    <text x="644" y="652" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E4D40">新建或关联</text>
    <line x1="786" y1="646" x2="826" y2="646" stroke="#5E8C7B" stroke-width="1.5"/>
    <text x="840" y="652" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">持续跟踪</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="700" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">04 / 14</text>
  </g>
</svg>
