    <text x="448" y="318" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#22302B">项业务不变量 · 全部通过</text>
    <text x="448" y="350" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5C6B64">真实数据库上的集成断言</text>
  </g>

  <g id="kpi-e2e">
