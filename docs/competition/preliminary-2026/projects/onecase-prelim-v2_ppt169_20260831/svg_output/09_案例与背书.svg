    <line x1="816" y1="180" x2="816" y2="360" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="evidence-rows">
    <line x1="64" y1="400" x2="1216" y2="400" stroke="#D8DED6" stroke-width="1"/>
