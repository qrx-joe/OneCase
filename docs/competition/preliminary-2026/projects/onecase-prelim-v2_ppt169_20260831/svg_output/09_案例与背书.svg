  <g id="source">
    <text x="64" y="656" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">来源：仓库自动化测试套件 · 2026-08-31 本机实测 · 另含 6 个子包类型检查全部通过</text>
