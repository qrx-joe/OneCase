    <text x="104" y="526" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E4D40">工程证据</text>
    <text x="240" y="526" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">源码仓库、演示脚本与全部自动化测试用例，可现场复核</text>
