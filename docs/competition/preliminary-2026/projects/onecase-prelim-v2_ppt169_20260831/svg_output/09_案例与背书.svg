    <text x="240" y="446" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">从文字整理到事项跟踪的 MVP 完整实现，含 AI 降级与人工兜底路径</text>
    <line x1="64" y1="480" x2="1216" y2="480" stroke="#E4E8E1" stroke-width="1"/>
