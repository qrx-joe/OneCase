<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF7"/>

  <g id="header">
    <text x="64" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#D97B29" letter-spacing="4" font-weight="bold">边界 · 能力如实申报</text>
    <text x="64" y="118" font-family="Georgia, SimSun, serif" font-size="42" font-weight="bold" fill="#1E4D40">只讲已经实现的</text>
    <line x1="64" y1="142" x2="1216" y2="142" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="scope-now">
    <line x1="64" y1="180" x2="416" y2="180" stroke="#2E7D5B" stroke-width="3"/>
    <path d="M 66,206 L 72,212 L 84,198" stroke="#2E7D5B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="216" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">当前已实现</text>
    <circle cx="72" cy="282" r="4" fill="#2E7D5B"/><text x="96" y="288" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">文字输入与长度校验</text>
    <circle cx="72" cy="330" r="4" fill="#2E7D5B"/><text x="96" y="336" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">草稿检查与编辑</text>
    <circle cx="72" cy="378" r="4" fill="#2E7D5B"/><text x="96" y="384" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">相似候选与人工确认</text>
    <circle cx="72" cy="426" r="4" fill="#2E7D5B"/><text x="96" y="432" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">事项跟踪与统计</text>
  </g>

  <g id="scope-pre">
    <line x1="448" y1="180" x2="800" y2="180" stroke="#B5442E" stroke-width="3"/>
    <circle cx="456" cy="206" r="9" fill="none" stroke="#B5442E" stroke-width="2.5"/>
    <text x="484" y="216" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">试点前补齐</text>
    <circle cx="456" cy="282" r="4" fill="none" stroke="#B5442E" stroke-width="1.5"/><text x="480" y="288" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">身份认证与权限</text>
    <circle cx="456" cy="330" r="4" fill="none" stroke="#B5442E" stroke-width="1.5"/><text x="480" y="336" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">组织数据隔离</text>
    <circle cx="456" cy="378" r="4" fill="none" stroke="#B5442E" stroke-width="1.5"/><text x="480" y="384" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">输入与访问限制</text>
    <circle cx="456" cy="426" r="4" fill="none" stroke="#B5442E" stroke-width="1.5"/><text x="480" y="432" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">草稿找回</text>
  </g>

  <g id="scope-future">
    <line x1="832" y1="180" x2="1184" y2="180" stroke="#5E8C7B" stroke-width="3"/>
    <polygon points="840,197 850,207 840,217 830,207" fill="none" stroke="#5E8C7B" stroke-width="2.5"/>
    <text x="868" y="216" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#22302B">后续评估</text>
    <polygon points="840,278 846,284 840,290 834,284" fill="none" stroke="#5E8C7B" stroke-width="1.5"/><text x="864" y="288" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">图片 / 语音输入</text>
    <polygon points="840,326 846,332 840,338 834,332" fill="none" stroke="#5E8C7B" stroke-width="1.5"/><text x="864" y="336" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">微信等渠道接入</text>
    <polygon points="840,374 846,380 840,386 834,380" fill="none" stroke="#5E8C7B" stroke-width="1.5"/><text x="864" y="384" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#22302B">语义检索（Embedding）</text>
  </g>

  <g id="scope-separators">
    <line x1="432" y1="180" x2="432" y2="470" stroke="#D8DED6" stroke-width="1"/>
    <line x1="816" y1="180" x2="816" y2="470" stroke="#D8DED6" stroke-width="1"/>
  </g>

  <g id="note">
    <line x1="64" y1="520" x2="1216" y2="520" stroke="#D8DED6" stroke-width="1"/>
    <text x="64" y="570" font-family="Georgia, SimSun, serif" font-size="26" fill="#1E4D40">如实划界，比夸大更能建立信任。</text>
    <text x="64" y="616" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#5C6B64">页面中的图片、语音入口样式尚未打通，不计入已实现能力；当前版本面向受控演示，不声称满足真实部署条件。</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">OneCase · 初赛路演</text>
    <text x="1216" y="694" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8A968F">12 / 14</text>
  </g>
</svg>
